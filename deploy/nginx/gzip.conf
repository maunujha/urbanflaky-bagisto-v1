# Urbanflaky perf P1 (#1) — text-asset compression.
#
# nginx.conf ships `gzip on;` but leaves gzip_types/comp_level/vary COMMENTED OUT,
# so by default only text/html is compressed and CSS/JS/JSON/SVG go out raw
# (~357 KB uncompressed on the storefront). This drop-in adds the type list + tuning.
#
# Install (http context — nginx.conf already `include`s /etc/nginx/conf.d/*.conf):
#   sudo cp deploy/nginx/gzip.conf /etc/nginx/conf.d/gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify:  curl -sI --compressed https://urbanflaky.in/themes/shop/default/build/assets/app-*.js | grep -i content-encoding  → gzip
#
# NOTE: woff2 and images (webp/jpg/png) are intentionally excluded — already compressed;
# gzipping them wastes CPU for ~0 gain. Brotli is NOT installed on this box (stock nginx
# 1.24 has no brotli module); enabling it later needs `libnginx-mod-http-brotli`.

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/manifest+json
    font/ttf
    font/otf
    image/svg+xml;

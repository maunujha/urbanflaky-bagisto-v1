; Urbanflaky perf P1 (#5) — OPcache production tuning.
;
; Overrides the stock php defaults (which the box was running: 128 MB / 10000 files /
; validate_timestamps On). Bagisto ships ~13,700 PHP files, so the 10000-file cap forced
; constant eviction + recompilation. This file loads AFTER 10-opcache.ini and overrides it.
;
; Install (FPM SAPI only — leaves CLI defaults intact):
;   sudo cp deploy/php/99-urbanflaky-opcache.ini /etc/php/8.3/fpm/conf.d/99-urbanflaky-opcache.ini
;   sudo systemctl restart php8.3-fpm            # restart (not reload) — clears + rebuilds opcache
;
; Verify:  sudo /usr/sbin/php-fpm8.3 -i | grep -E 'opcache.(memory|max_accel|interned|revalidate)'
;
; save_comments is intentionally NOT disabled — Laravel/Bagisto read doc-comment annotations.
;
; validate_timestamps stays On with revalidate_freq=60 (checks each file's mtime at most once
; per 60s instead of the default 2s). This keeps the "edit a file on the server and it just
; works" safety net. To squeeze out the last bit, set validate_timestamps=0 — but then EVERY
; code change needs `systemctl restart php8.3-fpm` (uf-deploy already does this, so it is safe
; for the normal deploy path; the risk is only a manual hot-edit that skips uf-deploy).

opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=32531
opcache.validate_timestamps=1
opcache.revalidate_freq=60
